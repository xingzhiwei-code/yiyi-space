spring:
  application:
    name: yiyixing-space

  # DataSource - overridden in application-dev.yml
  datasource:
    url: jdbc:mysql://localhost:3306/yiyixing?serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Redis
  data:
    redis:
      host: localhost
      port: 6379

# Server
server:
  port: 8080

# JWT config
jwt:
  secret: yiyixing-space-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256
  expiration-ms: 900000        # 15 minutes
  refresh-expiration-ms: 604800000  # 7 days

# Logging
logging:
  level:
    com.yiyixing: DEBUG
    org.springframework.security: DEBUG
