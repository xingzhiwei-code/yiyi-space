# 开发环境配置
# 覆盖 application.yml 中的默认值

spring:
  # Homebrew 安装的 MySQL 默认无密码 root
  datasource:
    url: jdbc:mysql://localhost:3306/yiyixing?serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# 日志
logging:
  level:
    com.yiyixing: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
